{% extends 'base.html' %}

{% block title %}Inicio - MangaStock{% endblock %}

{% block content %}
<section
    style="background-color: var(--bg-card); padding: 3rem 2rem; border-radius: 12px; border: 1px solid var(--borde); box-shadow: var(--sombra); text-align: center;">
    <h1 style="font-size: 2.25rem; font-weight: 800; margin-bottom: 1rem; color: var(--texto-principal);">
        Sistema de Control de Inventario
    </h1>
    <p
        style="font-size: 1.1rem; color: var(--texto-secundario); max-width: 600px; margin: 0 auto 2rem auto; line-height: 1.6;">
        Plataforma administrativa para la gestión de existencias, control editorial y registro de tomos físicos de
        manga.
    </p>

    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="{% url 'listar_tomos' %}"
            style="background-color: var(--color-primario); color: #ffffff; text-decoration: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600;">
            Ver Inventario
        </a>
    </div>
</section>
{% endblock %}
